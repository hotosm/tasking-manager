site_name: tasking-manager
site_description: The HOT Tasking Manager
# strict: true
site_url: "https://www.hotosm.org"

repo_name: "hotosm/tasking-manager"
repo_url: "https://github.com/hotosm/tasking-manager/"
edit_uri: "edit/main/docs/"

extra:
  social:
    - icon: "fontawesome/brands/github"
      link: "https://github.com/hotosm/"
    - icon: "fontawesome/brands/twitter"
      link: "https://twitter.com/hotosm"
    - icon: "fontawesome/solid/globe"
      link: "https://www.hotosm.org"
  copyright: Copyright &copy; 2010 HOTOSM
  generator: false

theme:
  name: material
  palette:
    primary: custom
  favicon: images/favicon.png
  logo: images/hot_logo.png
  # custom_dir: docs/overrides

extra_css:
  - css/extra.css

markdown_extensions:
  - tables
  - toc:
      permalink: true
      title: Page contents
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.extra
  - pymdownx.emoji:
  - pymdownx.tabbed:
      alternate_style: true

plugins:
#  - mkdocs_protobuf:
#      proto_dir: */*.proto *.proto
  - search
  - exclude:
      glob:
        - plugins/*
        - __pycache__/*
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            members_order: source
            separate_signature: true
            filters: ["!^_"]
            docstring_options:
              ignore_init_summary: true
            merge_init_into_class: true

nav:
  - Inicio: index.md
  - Sobre el desarrollo:
      - Contribuciones: developers/contributing.md
      - Codigo de conducta: developers/code_of_conduct.md
      - Guias de contribución: developers/contributing-guidelines.md
      - Configuración de desarrollo: developers/development-setup.md
      - Códigos de Error: developers/error_code.md
  - Arquitectura y Diseño:
      - Diagramas de Flujo de Datos: dataflow.md
      - Esquema de Base de Datos: developers/tmschema.md
      - Jerarquía de Clases: apidocs/html/index.html
  - Administradores del Sistema:
      - Arquitectura: sysadmins/architecture.md
      - CI: sysadmins/ci-cd.md
  - Validación: validation.md
  - License: LICENSE.md
#  - Changelog: CHANGELOG.md
