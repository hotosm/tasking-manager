name: 🧪 PR Test Frontend

on:
  pull_request:
    branches:
      - main
      - staging
      - develop
    paths:
      - "frontend/**"
  workflow_dispatch:

jobs:
  build:
    name: Build Static Files
    runs-on: ubuntu-latest

    environment:
      name: develop
      url: "https://just.build.test"

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Use Node.js 22.12.0
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: frontend/node_modules
          key: tm-fe-${{ runner.os }}-build-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            tm-fe-${{ runner.os }}-build-${{ hashFiles('frontend/package.json') }}

      - name: Install yarn
        run: npm install -g yarn

      - name: Load Environment from GitHub variables & secrets.
        uses: hotosm/gh-workflows/.github/actions/vars_n_secret_to_env@env_substitute/1.0.0
        with:
          vars_context: ${{ toJson(vars) }}
          secrets_context: ${{ toJson(secrets) }}

      - name: Create .env file
        uses: hotosm/gh-workflows/.github/actions/env_substitute@env_substitute/1.0.0
        with:
          working_directory: ./frontend
          template_dotenv: .env.expand
          output_file: .env

      - name: Install dependencies
        working-directory: ./frontend
        run: yarn install

      # Fails on a duplicate message id (build-locales exits non-zero) and on a
      # stale catalog (regenerating changes the committed file). See #7284.
      - name: Check translation source file is up to date
        working-directory: ./frontend
        run: |
          yarn build-locales
          # combine-messages writes no trailing newline; pre-commit's end-of-file-fixer
          # adds one to the committed file. Match it so the diff is content-only.
          [ -z "$(tail -c1 src/locales/en.json)" ] || printf '\n' >> src/locales/en.json
          git diff --exit-code -- src/locales/en.json

      - name: Run Yarn test
        working-directory: ./frontend
        run: yarn test

      - name: Generate build
        working-directory: ./frontend
        run: |
          yarn build

      - name: Upload Builds Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tm-fe-${{ github.sha }}
          path: ./frontend/build
          retention-days: 2

  frontend-dev-image-build:
    name: Build dev image for testing
    uses: hotosm/gh-workflows/.github/workflows/image_build.yml@3.6.0
    with:
      image_name: ghcr.io/${{ github.repository }}/frontend
      build_target: debug
      dockerfile: scripts/docker/Dockerfile.frontend
      scan_image: false
      scan_dockerfile: false
